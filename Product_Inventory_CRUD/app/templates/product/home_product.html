<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <style>
/* Base smoky white background */
body {
    background-color: #f5f5f5; /* White Smoke */
    font-family: 'Inter', sans-serif;
    color: #334155;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

/* Header with smoky accents */
.header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 0 10px;
}

.header-flex h2 {
    font-weight: 300;
    color: #1e293b;
    letter-spacing: -0.025em;
}

/* Glassmorphic product grid */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}

/* Smoky card design */
.card {
    background: rgba(255, 255, 255, 0.7); /* Semi-transparent white */
    backdrop-filter: blur(12px); /* Frosted glass effect */
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.4); /* Subtle highlight */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); /* Soft smoky shadow */
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    background: rgba(255, 255, 255, 0.85);
}

/* Product Image */
.card-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 16px;
    background-color: #e2e8f0; /* Smoky gray placeholder */
}

/* Price and tags */
.price-tag {
    font-weight: 700;
    color: #0f172a;
    background: #ffffff;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.95rem;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
}

/* Minimalist Button */
.btn-ghost {
    text-decoration: none;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    transition: all 0.2s;
    background: white;
}

.btn-ghost:hover {
    background: #aac9d0;
    color: #1e293b;
    border-color: #cbd5e1;
}

    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>Product Catalog</h2>
        <a href="{% url 'product_list' %}" class="btn btn-ghost">Admin Panel</a>
    </div>

    <div class="product-grid">
        {% for product in products %}
        <div class="card">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img" alt="{{ product.name }}">
            {% else %}
                <img src="via.placeholder.com" class="card-img">
            {% endif %}
            
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3 style="margin: 0;">{{ product.name }}</h3>
                    <small style="color: #64748b;">{{ product.category }}</small>
                </div>
                <span class="price-tag">${{ product.price }}</span>
            </div>
            
            <p style="margin: 15px 0; font-size: 0.9rem;">Stock: <b>{{ product.stock }} units</b></p>
        </div>
        {% empty %}
        <p>No products available.</p>
        {% endfor %}
    </div>
</div>


</body>
</html>
